name: Main site CI

on:
  push:
    branches: [ "prod" ]
    paths:
      - 'portfolio/**'
      - 'Dockerfile.nginx'
      - 'deployment/default.conf'
  pull_request:
    branches: [ "prod" ]
    paths:
      - 'portfolio/**'
      - 'Dockerfile.nginx'
      - 'deployment/default.conf'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: portfolio
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Build with Jekyll
        working-directory: portfolio
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./portfolio/_site

  publish-docker-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./_site

      - name: Build and push Docker Nginx image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-nginx:latest \
            --tag ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-nginx:latest \
            --platform linux/amd64,linux/arm64 \
            --push \
            --file Dockerfile.nginx .
