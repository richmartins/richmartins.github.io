server {

    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        root /var/www/html/;
        index index.html;
    }

    error_page 404 /404.html;

    location ~ /\.ht {
        deny all;
    }

    location ~ ^/(application|system|tests)/ {
        return 403;
    }
}
